[project]
name = "tarefas"
version = "0.1.0"
description = "API REST interna de tarefas com janelas de prazo"
readme = "README.md"
authors = [
    { name = "Anderson Souza", email = "andersom.eugenio@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.142.2",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.ruff]
target-version = "py314"
extend-exclude = ["_bmad", ".claude"]
