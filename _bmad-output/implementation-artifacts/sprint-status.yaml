# DEFINIÇÕES DE STATUS:
# =====================
# Status do épico:
#   - backlog: épico ainda não começou
#   - in-progress: épico em andamento
#   - done: todas as stories do épico concluídas
#
# Transições do épico:
#   - backlog → in-progress: automática quando a primeira story é criada (create-story)
#   - in-progress → done: manual quando todas as stories chegam a 'done'
#
# Status da story:
#   - backlog: a story só existe no epics.md
#   - ready-for-dev: arquivo da story criado na pasta de stories
#   - in-progress: dev implementando
#   - review: pronta para code review
#   - done: story concluída
#
# Status da retrospectiva:
#   - optional: pode ser feita, mas não é obrigatória
#   - done: retrospectiva concluída
#
# Status dos itens de ação:
#   - open: assumido em uma retrospectiva, ainda não tratado
#   - in-progress: em andamento
#   - done: concluído
#
# NOTAS DO WORKFLOW:
# ==================
# - O épico passa a 'in-progress' automaticamente quando a primeira story é criada
# - Stories podem andar em paralelo se houver capacidade
# - O dev normalmente cria a próxima story depois que a anterior chega a 'done', para aproveitar o aprendizado
# - O dev move a story para 'review' e roda o code review (contexto novo; outro LLM é recomendado)
# - A retrospectiva acrescenta itens de ação em action_items; o sprint-status mostra os abertos

